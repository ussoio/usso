services:
  app:
    build: app
    restart: unless-stopped
    hostname: ${PROJECT_NAME}
    ports:
      - "8001:8000"
    env_file:
      - .env
    networks:
      - mongo-net
      - gateway-net

  dashboard:
    image: oven/bun:1
    working_dir: /app
    command: bun dev
    volumes:
      - ./dashboard:/app
    ports:
      - "3036:3036"
    environment:
      - NEXT_PUBLIC_USSO_API_URL=http://localhost:8001
    depends_on:
      - app

networks:
  mongo-net:
    external: true
  gateway-net:
    external: true
