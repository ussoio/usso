services:
  app:
    build: app
    restart: unless-stopped
    container_name: usso-io-app
    hostname: ${PROJECT_NAME}
    env_file:
      - .env
    networks:
      - traefik-net
      - mongo-net
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.middlewares.${PROJECT_NAME}-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${PROJECT_NAME}-https.redirectscheme.permanent=true"
      # HTTP router (redirect only)
      - "traefik.http.routers.${PROJECT_NAME}.entrypoints=web"
      - "traefik.http.routers.${PROJECT_NAME}.rule=(${DOMAINS}) && (PathPrefix(`/api`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.${PROJECT_NAME}.priority=100"
      - "traefik.http.routers.${PROJECT_NAME}.middlewares=${PROJECT_NAME}-https"
      # HTTPS router
      - "traefik.http.routers.${PROJECT_NAME}-secure.entrypoints=websecure"
      - "traefik.http.routers.${PROJECT_NAME}-secure.rule=(${DOMAINS}) && (PathPrefix(`/api`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.${PROJECT_NAME}-secure.priority=100"
      - "traefik.http.routers.${PROJECT_NAME}-secure.tls=true"
      - "traefik.http.routers.${PROJECT_NAME}-secure.tls.certresolver=letsencrypt"
      - "traefik.http.services.${PROJECT_NAME}.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-net"

networks:
  traefik-net:
    external: true
  mongo-net:
    external: true
